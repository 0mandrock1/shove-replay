<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SHOVE — replay viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="head-row">
    <h1>SHOVE <span class="sub" data-i18n="h1_sub">replay viewer</span></h1>
    <nav id="toolbar" data-i18n-label="aria_toolbar" aria-label="Panels &amp; language">
      <button id="btn-glossary" type="button" data-i18n="nav_glossary" aria-expanded="false">Glossary</button>
      <button id="btn-help" type="button" data-i18n="nav_help" aria-expanded="false">Help</button>
      <button id="lang-toggle" type="button">EN</button>
    </nav>
  </div>
  <p class="tag" data-i18n-html="tagline"></p>
</header>

<section id="panels">
  <details id="glossary-box">
    <summary data-i18n="gloss_title">Glossary</summary>
    <div id="glossary"></div>
  </details>
  <details id="help-box">
    <summary data-i18n="help_title">Help</summary>
    <div id="help"></div>
  </details>
</section>

<main>
  <aside id="sessions" data-i18n-label="sessions_h2" aria-label="Sessions">
    <h2 data-i18n="sessions_h2">Sessions</h2>
    <ul id="session-list"></ul>
  </aside>

  <section id="stage">
    <div id="session-head"></div>

    <!-- replayable board view -->
    <div id="board-view" hidden>
      <div id="board-wrap">
        <div id="board" role="img" data-i18n-label="aria_board" aria-label="game board"></div>
      </div>

      <div id="controls">
        <button id="btn-first" data-i18n-title="ctrl_first" title="First (Home)">⏮</button>
        <button id="btn-prev"  data-i18n-title="ctrl_prev"  title="Previous (←)">◀</button>
        <button id="btn-play"  data-i18n-title="ctrl_play"  title="Play / Pause (space)">▶</button>
        <button id="btn-next"  data-i18n-title="ctrl_next"  title="Next (→)">▶</button>
        <button id="btn-last"  data-i18n-title="ctrl_last"  title="Last (End)">⏭</button>
        <input id="slider" type="range" min="0" max="0" value="0" data-i18n-label="aria_scrubber" aria-label="Turn scrubber">
        <label class="speed"><span data-i18n="speed_label">speed</span>
          <select id="speed">
            <option value="1400">0.7×</option>
            <option value="900" selected>1×</option>
            <option value="500">2×</option>
            <option value="250">4×</option>
          </select>
        </label>
      </div>

      <div id="frame-meta"></div>
      <div id="cmd-line"></div>
      <div id="log"></div>

      <details id="legend-box" open>
        <summary data-i18n="legend_summary">Legend</summary>
        <div id="legend"></div>
      </details>
    </div>

    <!-- non-replayable timeline view -->
    <div id="timeline-view" hidden></div>
  </section>
</main>

<footer>
  <p data-i18n="footer_text"></p>
</footer>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
